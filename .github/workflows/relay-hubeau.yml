name: Relay Hub'Eau (collecte débits journaliers)

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1

      - name: Collect last 30 days of daily discharges
        run: |
          python3 - <<'EOF'
          import urllib.request, json, time, datetime, os
          B = "https://hubeau.eaufrance.fr/api/v2/hydrometrie/obs_elab"
          def get(url, tries=4):
              last = None
              for i in range(tries):
                  try:
                      return json.loads(urllib.request.urlopen(
                          urllib.request.Request(url, headers={"User-Agent": "DebitsRivieres-relay/1.0"}),
                          timeout=120).read())
                  except TimeoutError:
                      time.sleep(10)
                  except Exception as e:
                      last = e
                      time.sleep(10)
              raise RuntimeError(f"échec après {tries} essais: {last}")
          out = {}
          today = datetime.date.today()
          start = today - datetime.timedelta(days=30)
          day = start
          total = 0
          os.makedirs("daily", exist_ok=True)
          os.makedirs("daily/stations", exist_ok=True)
          while day <= today:
              url = (f"{B}?grandeur_hydro_elab=QmnJ"
                     f"&date_debut_obs_elab={day.isoformat()}"
                     f"&date_fin_obs_elab={(day + datetime.timedelta(days=1)).isoformat()}"
                     f"&size=20000&format=json&sort=asc"
                     f"&fields=code_station,date_obs_elab,resultat_obs_elab")
              try:
                  d = get(url)
                  n = 0
                  for o in d.get("data", []):
                      r = o.get("resultat_obs_elab")
                      if r is None:
                          continue
                      code = o["code_station"]
                      if code not in out:
                          out[code] = []
                      out[code].append([o["date_obs_elab"], r / 1000.0])
                      n += 1
                  total += n
                  print(f"{day}: {n} obs", flush=True)
              except Exception as e:
                  print(f"{day}: FAIL {e}", flush=True)
              day += datetime.timedelta(days=1)
              time.sleep(1)
          for code, obs in out.items():
              seen = {}
              for date, val in obs:
                  seen[date] = val
              dedup = [[d, v] for d, v in sorted(seen.items())]
              out[code] = dedup
              with open(f"daily/stations/{code}.json", "w", encoding="utf-8") as f:
                  json.dump({"generated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                             "obs": dedup}, f, ensure_ascii=False, separators=(",", ":"))
          with open("daily/debits_30j.json", "w", encoding="utf-8") as f:
              json.dump({"generated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                         "stations": out}, f, ensure_ascii=False, separators=(",", ":"))
          print(f"DONE total={total} stations={len(out)}")
          if len(out) < 500:
              raise RuntimeError(f"collecte suspecte: seulement {len(out)} stations, snapshot non remplacé")
          EOF

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          git commit -m "Mise à jour débits 30j $(date -u +%F)" || echo "rien à committer"
          git push origin data
