name: Relay Hub'Eau (collecte débits journaliers)

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1

      - name: Collect last 30 days of daily discharges
        run: |
          python3 - <<'EOF'
          import urllib.request, json, time, datetime, os
          B = "https://hubeau.eaufrance.fr/api/v2/hydrometrie/obs_elab"
          def get(url, tries=3):
              for i in range(tries):
                  try:
                      return json.loads(urllib.request.urlopen(
                          urllib.request.Request(url, headers={"User-Agent": "DebitsRivieres-relay/1.0"}),
                          timeout=120).read())
                  except TimeoutError:
                      time.sleep(5)
              raise TimeoutError(url)
          os.makedirs("daily", exist_ok=True)
          today = datetime.date.today()
          start = today - datetime.timedelta(days=30)
          # fetch page by page with cursor-less date windows (1 day per request)
          out = {}
          day = start
          while day <= today:
              url = (f"{B}?grandeur_hydro_elab=QmnJ&date_debut_obs_elab={day.isoformat()}"
                     f"&size=20000&format=json&fields=code_station,date_obs_elab,resultat_obs_elab")
              try:
                  d = get(url)
                  for o in d.get("data", []):
                      code = o["code_station"]
                      out.setdefault(code, []).append([o["date_obs_elab"], o["resultat_obs_elab"] / 1000.0])
                  print(f"{day}: {len(d.get('data', []))} obs", flush=True)
              except Exception as e:
                  print(f"{day}: FAIL {e}", flush=True)
              day += datetime.timedelta(days=1)
              time.sleep(1)
          with open("daily/debits_30j.json", "w", encoding="utf-8") as f:
              json.dump({"generated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                         "stations": out}, f, ensure_ascii=False, separators=(",", ":"))
          print("stations:", len(out))
          EOF

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          git commit -m "Mise à jour débits 30j $(date -u +%F)" || echo "rien à committer"
          git push origin data
